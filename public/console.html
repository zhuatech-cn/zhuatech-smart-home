<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华全屋智能管理端</title><link rel="stylesheet" href="/styles.css"><style>:root{--accent:#8a4c32;--accent-soft:#f7ebe5;--nav:#30241e}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">ZH</span><div>知华全屋智能<small>SMART HOME CLOUD</small></div></div><nav class="nav"><div class="active">家庭总览</div><div>家庭与成员</div><div>空间管理</div><div>设备中心</div><div>场景联动</div><div>自动化规则</div><div>能耗中心</div><div>安全告警</div></nav><div class="sidebar-foot">上海如静知华信息科技有限公司</div></aside><main class="main"><header class="top"><div><h1>全屋智能管理台</h1><div class="muted">家庭空间、设备健康、场景联动和安全事件统一管理</div></div><span class="status"><i class="dot"></i>家庭网络在线</span></header><section class="metrics" id="metrics"></section><div class="grid"><section class="card"><div class="section-title"><h2>设备运行状态</h2><button class="button">添加设备</button></div><div class="table-wrap"><table class="table"><thead><tr><th>设备</th><th>房间</th><th>协议</th><th>固件</th><th>状态</th></tr></thead><tbody id="devices"></tbody></table></div></section><aside class="card"><div class="section-title"><h2>自动化规则</h2><span class="muted">实时运行</span></div><div id="automations"></div></aside></div><div class="grid equal"><section class="card"><div class="section-title"><h2>场景库</h2><span class="pill">可执行</span></div><div id="scenes"></div></section><section class="card"><div class="section-title"><h2>安全告警</h2><span class="muted">事件闭环</span></div><div id="alarms"></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const labels={rooms:'房间',devices:'设备',online:'在线设备',scenes:'场景',automations:'自动化',energyKwh:'累计用电',openAlarms:'安全告警'};metrics.innerHTML=Object.entries(d.metrics).slice(0,5).map(([k,v])=>`<div class="card metric"><span class="muted">${labels[k]}</span><strong>${v}</strong><em>运行稳定</em></div>`).join('');devices.innerHTML=d.devices.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.serialNo)}</div></td><td>${esc(d.rooms.find(r=>r.id===x.roomId)?.name||'--')}</td><td>${esc(x.protocol)}</td><td>${esc(x.firmwareVersion)}</td><td><span class="pill ${x.state.online?'':'danger'}">${x.state.online?'在线':'离线'}</span></td></tr>`).join('');automations.innerHTML=d.automations.map(x=>`<div class="list-row"><div><strong>${esc(x.name)}</strong><span class="muted">已执行 ${x.executions} 次</span></div><span class="pill">启用</span></div>`).join('');scenes.innerHTML=d.scenes.map(x=>`<div class="list-row"><div><strong>${esc(x.name)}</strong><span class="muted">${x.actions.length}个动作 · 已运行${x.executions}次</span></div><button class="button ghost">执行</button></div>`).join('');alarms.innerHTML=d.alarms.length?d.alarms.map(x=>`<div class="list-row"><div><strong>${esc(x.type)}</strong><span class="muted">${new Date(x.firstSeenAt).toLocaleString('zh-CN')}</span></div><span class="pill danger">${esc(x.status)}</span></div>`).join(''):'<div class="empty">当前没有安全告警</div>'})</script></body></html>
