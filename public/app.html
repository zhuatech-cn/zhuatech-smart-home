<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华全屋智能</title><link rel="stylesheet" href="/styles.css"><style>:root{--accent:#8a4c32;--accent-soft:#f7ebe5;--nav:#30241e}.device-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.device{background:#fff;border:1px solid #e9e1dc;border-radius:13px;padding:17px}.device-icon{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:20px;font-size:20px}.switch{width:38px;height:21px;border-radius:20px;background:var(--accent);position:relative}.switch:after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;right:2px;top:2px}@media(max-width:700px){.device-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="client"><section class="hero"><div><span class="pill">知华智慧之家</span><h1>晚上好，家庭管理员</h1><p>上海 · 室内 25.3℃ · 空气质量优</p></div><div class="hero-stat"><span>设备在线</span><strong id="online">-- / --</strong><span>今日用电 2.6 kWh</span></div></section><div class="tabs"><button class="tab active">全屋</button><button class="tab">客厅</button><button class="tab">主卧</button><button class="tab">厨房</button><button class="tab">安防</button></div><section class="grid"><div><div class="section-title"><h2>常用设备</h2><span class="muted">长按进入设备设置</span></div><div class="device-grid" id="devices"></div></div><aside class="card"><div class="section-title"><h2>快捷场景</h2><span class="muted">一键联动</span></div><div id="scenes"></div></aside></section><section class="card"><div class="section-title"><h2>家庭状态</h2><span class="pill">安全</span></div><div class="mini-grid"><div class="mini"><span class="muted">门窗</span><strong>全部关闭</strong></div><div class="mini"><span class="muted">空气质量</span><strong>优 32</strong></div><div class="mini"><span class="muted">今日用电</span><strong>2.6 kWh</strong></div><div class="mini"><span class="muted">自动化</span><strong id="autos">-- 条运行</strong></div></div></section><p class="footer-note">上海如静知华信息科技有限公司 · <a href="https://www.zhuatech.cn/">www.zhuatech.cn</a></p></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=d=>{online.textContent=`${d.metrics.online} / ${d.metrics.devices}`;autos.textContent=`${d.metrics.automations} 条运行`;devices.innerHTML=d.devices.map(x=>`<article class="device"><div class="device-icon">${x.category==='light'?'◉':x.category==='sensor'?'⌁':'❄'}</div><strong>${esc(x.name)}</strong><div class="list-row"><span class="muted">${x.state.temperature??x.state.brightness??(x.state.power?'已开启':'已关闭')}${x.state.temperature!==undefined?'℃':x.state.brightness!==undefined?'%':''}</span><span class="${x.state.power===false?'pill neutral':'switch'}"></span></div></article>`).join('');scenes.innerHTML=d.scenes.map(x=>`<div class="list-row"><div><strong>${esc(x.name)}</strong><span class="muted">${x.actions.length}个设备动作</span></div><button class="button ghost">执行</button></div>`).join('')};fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(render)</script></body></html>
